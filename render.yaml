services:
  - type: web
    name: duo-game-date-bot
    env: python
    buildCommand: "pip install -r requirements.txt && python bootstrap_usque.py --register && (curl -fsSL https://deno.land/install.sh | sh || true)"
    startCommand: python bot.py
    plan: free
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        value: https://rds0645010.github.io/duo-game-date/
      - key: PORT
        value: 10000
      # Cloudflare WARP для YouTube: без регистрации, cookies и аккаунта Google.
      # Отключить можно значением "false".
      - key: WARP_ENABLED
        value: "true"
      # 512 МБ RAM на free-тарифе: одно тяжёлое скачивание за раз.
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "1"
      # Необязательный ручной прокси для YouTube (запасной вариант после WARP).
      - key: YOUTUBE_PROXY
        sync: false
      # Instagram 18+ сессия (sessionid):
      - key: INSTAGRAM_SESSIONID
        sync: false
      # Твой Telegram ID — без него админ-команды (/cookies) отключены.
      - key: ADMIN_ID
        sync: false
      # Ключ для /api/logs?key=... и /api/test_dl?key=... (без него они закрыты).
      - key: DEBUG_API_KEY
        sync: false
      # Необязательно: ID приватного Telegram-канала (бот должен быть админом) для невидимого
      # получения file_id в инлайне и фоновой предзагрузки слайдов без касания ЛС.
      - key: STORAGE_CHANNEL_ID
        sync: false
