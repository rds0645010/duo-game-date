services:
  - type: web
    name: duo-game-date-bot
    env: python
    buildCommand: "pip install -r requirements.txt && curl -fsSL https://deno.land/install.sh | sh"
    startCommand: python bot.py
    plan: free
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        value: https://rds0645010.github.io/duo-game-date/
      - key: PORT
        value: 10000
      - key: YOUTUBE_PROXY
        sync: false
